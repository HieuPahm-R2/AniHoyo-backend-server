spring:
  profiles:
    active: dev
  application:
    name: AniHoyo
  jpa:
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: 1000MB
      max-request-size: 1000MB
  data:
    redis:
      database: 0
      timeout: 60000
      jedis:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

anihoyo:
  jwt:
    access-token-validity-in-seconds: 8640
    refresh-token-validity-in-seconds: 864000

server:
  port: 8083
